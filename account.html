<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loopistry — My Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #555;
    }

    /* HEADER */
    header {
      height: 82px;
      background: #292929;
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 18px;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: cover;
    }

    .brand {
      color: #e7b77f;
      font-size: 30px;
      font-weight: bold;
      margin-right: auto;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 25px;
      font-size: 13px;
    }

    nav a:hover {
      color: #e7b77f;
    }

    /* ACCOUNT AREA */
    .account-section {
      min-height: calc(100vh - 82px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .account-box {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 4px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .account-box h1 {
      color: #dcae78;
      font-size: 38px;
      margin: 0 0 12px;
    }

    .welcome {
      font-size: 17px;
      margin-bottom: 35px;
    }

    .email-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      margin-bottom: 7px;
    }

    .email {
      font-size: 18px;
      color: #555;
      margin-bottom: 35px;
      font-weight: bold;
    }

    button {
      width: 220px;
      padding: 13px 20px;
      margin: 7px;
      border: 1px solid #dcae78;
      background: #e7b77f;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .logout {
      background: white;
      color: #9b6d3d;
    }

    /* MOBILE */
    @media (max-width: 800px) {
      header {
        height: auto;
        padding: 15px;
        flex-wrap: wrap;
      }

      .brand {
        font-size: 24px;
      }

      nav {
        width: 100%;
        text-align: center;
        padding-top: 10px;
      }

      nav a {
        display: inline-block;
        margin: 5px 8px;
      }

      .account-box {
        padding: 35px 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <img src="logo.png" class="logo" alt="Loopistry logo">

    <div class="brand">
      Loopistry
    </div>

    <nav>
      <a href="https://www.loopistry.co.uk">HOME</a>
      <a href="https://www.loopistry.co.uk">CROCHET PROJECTS</a>
      <a href="https://www.loopistry.co.uk">CROCHET TIPS & TRICKS</a>
      <a href="https://www.loopistry.co.uk">ABOUT LOOPISTRY</a>
      <a href="https://www.loopistry.co.uk">YARN & HOOK GUIDES</a>
    </nav>

  </header>


  <main class="account-section">

    <div class="account-box">

      <h1>My Account</h1>

      <p class="welcome">
        Welcome back to Loopistry 🧶
      </p>

      <p class="email-label">
        Logged in as
      </p>

      <p class="email" id="email">
        Loading...
      </p>

      <button onclick="goToLoopistry()">
        Back to Loopistry
      </button>

      <button class="logout" onclick="logout()">
        Log out
      </button>

    </div>

  </main>


  <script>

    const accessToken =
      localStorage.getItem("loopistry_access_token");

    const email =
      localStorage.getItem("loopistry_email");


    if (!accessToken || !email) {

      window.location.href = "index.html";

    } else {

      document.getElementById("email").textContent = email;

    }


    function goToLoopistry() {

      window.location.href =
        "https://www.loopistry.co.uk";

    }


    function logout() {

      localStorage.removeItem("loopistry_access_token");

      localStorage.removeItem("loopistry_email");

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
