<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loopistry — My Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 35px;

      border-radius: 12px;

      box-shadow: 0 4px 20px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .email {
      color: #666;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 7px;

      background: #222;
      color: white;

      font-size: 15px;

      cursor: pointer;

      margin-top: 8px;
    }

    button:hover {
      opacity: 0.85;
    }

    .secondary {
      background: #eee;
      color: #222;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>My Account</h1>

    <p>Welcome to Loopistry 👋</p>

    <p class="email" id="email"></p>

    <button onclick="goToLoopistry()">
      Back to Loopistry
    </button>

    <button class="secondary" onclick="logout()">
      Log out
    </button>

  </div>


  <script>

    const accessToken =
      localStorage.getItem("loopistry_access_token");

    const email =
      localStorage.getItem("loopistry_email");


    // If the person isn't logged in,
    // send them back to the login page.

    if (!accessToken || !email) {

      window.location.href = "index.html";

    } else {

      document.getElementById("email").textContent =
        email;

    }


    function goToLoopistry() {

      window.location.href =
        "https://www.loopistry.co.uk";

    }


    function logout() {

      localStorage.removeItem("loopistry_access_token");

      localStorage.removeItem("loopistry_email");

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
