<!DOCTYPE html>
<html>
<head>
  <title>Loopistry Login</title>
</head>
<body>

  <h1>Loopistry</h1>
  <h2>Log in</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>

  <button onclick="login()">Log in</button>
  <button onclick="signup()">Sign up</button>

  <p id="message"></p>

  <script>
    const SUPABASE_URL = "https://yjyazjczzxlmdnzplhce.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tPH3sltYS1psBonf8pwDCg_JdZjgaOY";

    async function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch(
        SUPABASE_URL + "/auth/v1/signup",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data = await response.json();

      document.getElementById("message").textContent =
        response.ok
          ? "Account created! Check your email if confirmation is required."
          : data.msg || data.message || "Something went wrong.";
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch(
        SUPABASE_URL + "/auth/v1/token?grant_type=password",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data = await response.json();

      document.getElementById("message").textContent =
        response.ok
          ? "You're logged in! 🎉"
          : data.error_description || data.msg || "Login failed.";
    }
  </script>

</body>
</html>
